# Rootless BuildKit job; scripts/build.sh fills in __NAME__, __IMAGE__ and __DOCKERFILE__.
apiVersion: batch/v1
kind: Job
metadata:
  name: build-__NAME__
  namespace: claude-trading
  labels: {app: claude-build}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: claude-build}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: buildkit
          image: moby/buildkit:v0.34.0-rootless
          env:
            - {name: BUILDKITD_FLAGS, value: --oci-worker-no-process-sandbox}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /tmp/ctx
              tar -xzf /src/context.tgz -C /tmp/ctx
              exec buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/tmp/ctx --local dockerfile=/tmp/ctx \
                --opt filename=__DOCKERFILE__ \
                --opt platform=linux/amd64 \
                --output type=image,name=__IMAGE__,push=true
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: Unconfined}
            appArmorProfile: {type: Unconfined}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - {name: context, mountPath: /src}
            - {name: docker-config, mountPath: /home/user/.docker}
            - {name: state, mountPath: /home/user/.local/share/buildkit}
      volumes:
        - name: context
          configMap: {name: build-context}
        - name: docker-config
          secret:
            secretName: registry-push
            items: [{key: .dockerconfigjson, path: config.json}]
        - name: state
          emptyDir: {}
