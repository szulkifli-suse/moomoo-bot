apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-data
  namespace: claude-trading
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
