# HTTPS on websecure, and plain HTTP redirected to HTTPS (same pattern as svirt.lepak-awan.com).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-dashboard
  namespace: claude-trading
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [darkloner.lepak-awan.com]
  rules:
    - host: darkloner.lepak-awan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: claude-dashboard, port: {name: http}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: claude-trading
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claude-dashboard-http
  namespace: claude-trading
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: claude-trading-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: darkloner.lepak-awan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: claude-dashboard, port: {name: http}}
