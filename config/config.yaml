# Claude Trading Desk settings. Every threshold lives here; change them by hand only.
# Mounted from the ConfigMap claude-config. Restart the pod after a change.

account:
  starting_capital_usd: 1000
  security_firm: FUTUMY
  acc_id: 0                 # 0 = first real US-capable account on the login
  allow_fractional: false   # moomoo OpenAPI fractional US orders are not confirmed for this account

universe:
  index: US..SPX
  plates:
    - US.LIST2015   # Semiconductors
    - US.LIST2016   # Semiconductor Equipment and Materials
    - US.LIST2470   # Software - Application
    - US.LIST2508   # Software - Infrastructure
    - US.LIST2252   # Information Technology Services
    - US.LIST2492   # Computer Hardware
    - US.LIST2075   # Consumer Electronics
    - US.LIST2098   # Communication Equipment
    - US.LIST2072   # Electronic Components
    - US.LIST2275   # Scientific and Technical Instruments
  # Used only when the index list can't be read through OpenD.
  fallback_min_market_cap_usd: 15000000000
  benchmark: US.QQQ

scout:
  sma_period: 50
  sma_rising_lookback_days: 10
  min_points: 2
  rvol_min: 1.3
  catalyst_lookback_days: 5
  catalyst_gap_pct: 3.0          # gap up of at least this much...
  catalyst_gap_volume_mult: 1.5  # ...on at least this multiple of average volume
  near_high_days: 20
  near_high_pct: 5.0
  rs_days: 20

filter:
  min_avg_dollar_volume_usd: 20000000
  max_spread_pct: 0.20
  spread_samples: 3
  spread_sample_gap_seconds: 60
  earnings_blackout_trading_days: 2
  reentry_cooldown_trading_days: 5
  max_reentries_after_stop: 1
  # The prompt says 1.0%, but with USD 1,000 capital a USD 200 position costs about 1.4%
  # round trip, so 1.0% would reject every trade. At USD 2,000+ capital, 1.0% works again.
  max_round_trip_cost_pct: 1.5

analyst:
  # auto: use your Claude subscription (CLAUDE_CODE_OAUTH_TOKEN, via Claude Code) when set,
  # otherwise the pay-per-use API key. Or force: claude_code / api.
  backend: auto
  cli_timeout_seconds: 600
  model: claude-opus-5-5
  effort: medium
  max_candidates_per_scan: 10
  min_score: 6
  web_search_max_uses: 5
  on_error: skip   # skip = no trade if the Analyst call fails

risk:
  position_pct: 20
  weak_position_pct: 20        # same size as normal; a weak market only cuts the number of positions (10% made fees block every trade)
  max_positions: 4
  weak_max_positions: 4        # regime rule off: a weak market changes nothing (3y backtest: better profit and drawdown)
  max_invested_pct: 80
  regime_sma_period: 50
  atr_period: 14
  stop_atr_mult: 2.0
  stop_min_pct: 4.0
  stop_max_pct: 10.0
  partial_at_r: 2.0
  trail_atr_mult: 2.0
  time_stop_trading_days: 20
  daily_loss_limit_pct: 3.0
  drawdown_limit_pct: 15.0
  check_interval_minutes: 5

executor:
  max_entry_slippage_pct: 0.3
  entry_timeout_minutes: 30

fees:
  # moomoo Malaysia US-stock fees from moomoo.com/my/support/topic9_136 (check in the app;
  # new users may get 0% commission for 180 days). Regulatory sell fees are tiny and left out.
  commission_pct: 0.03
  min_commission_usd: 0.01
  platform_fee_per_order_usd: 0.99
  settlement_per_share_usd: 0.003
  stamp_duty_pct: 0.10      # RM1 per RM1,000 on foreign shares, about 0.1%
  sst_pct: 8                # SST on commission, platform and settlement fees

schedule:
  # US Eastern times; the bot also checks moomoo's market state and trading days.
  premarket_job_et: "08:30"
  scan_minutes_after_open: [60, 120, 180, 240, 300]   # hourly: 10:30, 11:30, 12:30, 13:30, 14:30 ET
  scan_minutes_before_close: []
  no_scan_first_minutes: 30
  after_close_job_et: "16:15"

backtest:
  years: 3
